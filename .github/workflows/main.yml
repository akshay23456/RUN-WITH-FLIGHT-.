name: Build RUN WITH FLIGHT APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Landscape, fullscreen, hardware acceleration
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true"/' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' $S
          cat $M | head -30
      - name: Install game icon
        run: |
          R=android/app/src/main/res
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">RUN WITH FLIGHT</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">RUN WITH FLIGHT</string>#' $R/values/strings.xml
          if [ -f logo.png ]; then
            pip install pillow
            rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
            python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          R='android/app/src/main/res'
          src=Image.open('logo.png').convert('RGB')
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              im=src.resize((s,s),Image.LANCZOS)
              os.makedirs(f'{R}/mipmap-{d}',exist_ok=True)
              im.save(f'{R}/mipmap-{d}/ic_launcher.png')
              m=Image.new('L',(s*4,s*4),0); ImageDraw.Draw(m).ellipse((0,0,s*4-1,s*4-1),fill=255)
              r=im.convert('RGBA'); r.putalpha(m.resize((s,s),Image.LANCZOS))
              r.save(f'{R}/mipmap-{d}/ic_launcher_round.png')
              fg=f'{R}/mipmap-{d}/ic_launcher_foreground.png'
              if os.path.exists(fg): os.remove(fg)
          PY
          else
            echo "logo.png not found - using default icon"
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RUN-WITH-FLIGHT-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
